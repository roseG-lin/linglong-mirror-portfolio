<script>
'use strict';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function svgUse(id, size) { return '<svg class="icon" width="' + (size || 20) + '" height="' + (size || 20) + '"><use href="#' + id + '"/></svg>'; }


function toast(){}
const DEMOS = {
  'rag-pipeline': {
    mount(stage) {
      stage.innerHTML =
        '<div class="demo-card" style="margin-bottom:20px"><div class="t">同一问句 · search_test.py 第 5 问</div>' +
          '<p style="font-size:var(--text-lg);line-height:1.8;margin-top:4px">「用户做过哪些 AI 产品？」</p>' +
          '<p class="muted" style="font-size:var(--text-xs);margin-top:6px;line-height:1.7">语料里「想做的岗位」和「做过的作品」都写着 AI 产品四个字。分不分得清，看模式。点一个模式，现场跑一遍。</p>' +
          '<div class="chips" style="margin-top:14px">' +
            '<span class="chip on" data-m="0">① 纯向量</span><span class="chip" data-m="1">② +Query 改写</span><span class="chip" data-m="2">③ +混合检索（单用）</span><span class="chip" data-m="3">④ +Agentic 自评</span>' +
          '</div>' +
        '</div>' +
        '<div class="demo-card"><div class="t">检索实况</div><div data-out style="min-height:170px"><p class="muted" style="font-size:var(--text-sm)">默认正在跑① 纯向量。</p></div></div>' +
        '<div class="demo-kpis">' +
          '<div class="demo-kpi"><div class="v">119</div><div class="l">语料文件（第二大脑笔记）</div></div>' +
          '<div class="demo-kpi"><div class="v">1527</div><div class="l">语义切块</div></div>' +
          '<div class="demo-kpi"><div class="v">1529</div><div class="l">向量点 · BGE 768维</div></div>' +
          '<div class="demo-kpi"><div class="v">724s</div><div class="l">CPU 建库 · 零外部依赖</div></div>' +
          '<div class="demo-kpi"><div class="v">4/5→5/5</div><div class="l">baseline → 调优后</div></div>' +
        '</div>' +
        '<div class="demo-note">口径：RAG学习/search_test.py + RAG检索调优实战.md · four_mode_compare.py 现场可复跑</div>';
      const MODES = [
        { steps: [['向量检索中…', 'cosine top-5 · embed ~0.5s CPU']],
          hit: '00-画像/个人画像.md · 求职目标方向', score: '0.71',
          verdict: 'bad', vt: '✗ 字面命中，语义跑偏',
          why: '命中的是「想做 AI 产品岗」的画像页，没碰到「做过什么」的项目清单。baseline 成绩单：5 问 4 中。' },
        { steps: [['Query 改写…', '「AI 产品」→「AI产品 作品 项目 构建 落地」 · +0.8s'], ['向量检索中…', '改写后 top-5 · embed ~0.5s']],
          hit: '08-项目/内部项目 · 项目清单', score: '0.83',
          verdict: 'ok', vt: '✓ 语义鸿沟修平',
          why: '同一句话换个问法，答案就站在正确的文档上。实测 5/5。' },
        { steps: [['BM25 索引接入…', '1529 文档 jieba 分词 · 建索引几十秒'], ['双路召回中…', '字面权重上调']],
          hit: 'Top1 正确，Top5 混入 3 条字面噪音', score: '',
          verdict: 'warn', vt: '△ 噪音被字面权重放大',
          why: '混合检索单用反而退步到 4/5。它得和改写搭配（RRF 双路一致确认），才回到 5/5。' },
        { steps: [['第 1 轮 · 纯向量', 'Top1 画像页 · embed ~0.5s'], ['LLM 自评…', 'NO · 答非所问 · +1-3s'], ['自造新 query…', '「AI产品 作品 项目 玲珑 LUBAN」'], ['第 2 轮 · 重检索', 'Top1 项目清单 · embed ~0.5s'], ['LLM 复评…', 'YES · 收敛']],
          hit: '_项目MOC/内部项目 · 项目清单', score: '0.86',
          verdict: 'ok', vt: '✓ 2 轮自纠收敛',
          why: '检索错了，它自己知道，换句话再问一次。这就是 Agentic 和「接上就跑」的距离。' },
      ];
      const out = $('[data-out]', stage);
      const wait = ms => new Promise(r => setTimeout(r, REDUCED ? 50 : ms));
      let playing = 0;
      const play = async mi => {
        const my = ++playing;
        const m = MODES[mi];
        out.innerHTML = '';
        for (const [t, d] of m.steps) {
          if (my !== playing) return;
          const row = document.createElement('div');
          row.className = 'rag-node run';
          row.innerHTML = '<span class="st">▸</span><div class="bd"><div class="t">' + t + '</div><div class="d">' + d + '</div></div>';
          out.appendChild(row);
          await wait(420);
          row.classList.remove('run'); row.classList.add('done');
          row.querySelector('.st').textContent = '✓';
        }
        if (my !== playing) return;
        const hit = document.createElement('div');
        hit.className = 'rag-result on';
        hit.style.borderColor = m.verdict === 'ok' ? '' : (m.verdict === 'warn' ? 'hsl(var(--warn) / 0.45)' : 'hsl(var(--danger) / 0.45)');
        hit.style.background = m.verdict === 'ok' ? '' : (m.verdict === 'warn' ? 'hsl(var(--warn) / 0.06)' : 'hsl(var(--danger) / 0.06)');
        hit.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><b>Top1 · ' + m.hit + '</b>' + (m.score ? '<span class="mono muted" style="font-size:var(--text-xs)">score ' + m.score + '</span>' : '') + '</div>' +
          '<div style="margin-top:8px"><span class="verdict ' + m.verdict + '">' + m.vt + '</span></div>' +
          '<p class="muted" style="font-size:var(--text-xs);margin-top:8px;line-height:1.7">' + m.why + '</p>';
        out.appendChild(hit);
      };
      $$('.chip', stage).forEach(c => c.addEventListener('click', () => {
        $$('.chip', c.parentElement).forEach(x => x.classList.remove('on'));
        c.classList.add('on');
        play(+c.dataset.m);
      }));
      play(0);
    },
  },
};
const stage = document.getElementById('stage');
const run = () => { stage.innerHTML = ''; try { DEMOS['rag-pipeline'].mount(stage); } catch (e) { stage.innerHTML = '<p class="muted mono">Demo 未响应，请刷新重试。</p>'; } };
document.getElementById('resetBtn').addEventListener('click', run);
run();
/* 进度条 + aurora 静态降级 */
addEventListener('scroll', () => { const p = document.getElementById('progress'); const d = document.documentElement; p.style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%'; }, { passive: true });
</script>
